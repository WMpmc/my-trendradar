# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件
#                      Version: 2.4.0
# ═══════════════════════════════════════════════════════════════


# 可视化配置编辑器地址: https://sansan0.github.io/TrendRadar/


# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  timezone: "Asia/Shanghai"
  show_version_update: true


# ===============================================================
# 1.5 调度系统
# ===============================================================
schedule:
  enabled: false
  preset: "morning_evening"


# ===============================================================
# 2. 数据源 - 热榜平台
# ===============================================================
platforms:
  enabled: true
  api_url: ""
  sources:
    - id: "toutiao"
      name: "今日头条"
      expected_domain: "toutiao.com"
    - id: "baidu"
      name: "百度热搜"
      expected_domain: "baidu.com"
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"
    - id: "thepaper"
      name: "澎湃新闻"
      expected_domain: "thepaper.cn"
    - id: "bilibili-hot-search"
      name: "bilibili 热搜"
      expected_domain: "bilibili.com"
    - id: "cls-hot"
      name: "财联社热门"
      expected_domain: "cls.cn"
    - id: "ifeng"
      name: "凤凰网"
      expected_domain: "ifeng.com"
    - id: "tieba"
      name: "贴吧"
      expected_domain: "baidu.com"
    - id: "weibo"
      name: "微博"
      expected_domain: "weibo.com"
    - id: "douyin"
      name: "抖音"
      expected_domain: "douyin.com"
    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"


# ===============================================================
# 3. 数据源 - RSS 订阅
# ===============================================================
rss:
  enabled: true

  freshness_filter:
    enabled: true
    max_age_days: 2

  feeds:
    # --- 科技/财经综合 ---
    - id: "36kr"
      name: "36氪"
      url: "https://36kr.com/feed"

    - id: "huxiu"
      name: "虎嗅"
      url: "https://www.huxiu.com/rss/0.xml"

    - id: "ifanr"
      name: "爱范儿"
      url: "https://www.ifanr.com/feed"

    # --- 科华数据（自家公司） ---
    - id: "kehua-news"
      name: "科华数据"
      url: "https://news.google.com/rss/search?q=科华数据+OR+科华技术+OR+kehua&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    # --- 友商监控 ---
    - id: "huawei-digital-power"
      name: "华为数字能源"
      url: "https://news.google.com/rss/search?q=华为数字能源+OR+华为数据中心+OR+华为UPS&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    - id: "vertiv"
      name: "维谛技术"
      url: "https://news.google.com/rss/search?q=维谛技术+OR+Vertiv&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    - id: "kstar"
      name: "科士达"
      url: "https://news.google.com/rss/search?q=科士达+OR+KSTAR&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    - id: "eaton"
      name: "伊顿"
      url: "https://news.google.com/rss/search?q=伊顿+Eaton+UPS+OR+伊顿电气&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    - id: "schneider-apc"
      name: "施耐德APC"
      url: "https://news.google.com/rss/search?q=施耐德电气+OR+APC+UPS+OR+施耐德数据中心&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    - id: "delta"
      name: "台达"
      url: "https://news.google.com/rss/search?q=台达电子+OR+台达UPS+OR+Delta+Electronics&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    # --- 股份制银行（广东重点客户） ---
    - id: "cmb"
      name: "招商银行"
      url: "https://news.google.com/rss/search?q=招商银行+数据中心+OR+招商银行+IT+OR+招商银行+科技&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    - id: "cib"
      name: "兴业银行"
      url: "https://news.google.com/rss/search?q=兴业银行+数据中心+OR+兴业银行+科技+OR+兴业银行+IT&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    - id: "spdb"
      name: "浦发银行"
      url: "https://news.google.com/rss/search?q=浦发银行+数据中心+OR+浦发银行+科技&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    - id: "citic"
      name: "中信银行"
      url: "https://news.google.com/rss/search?q=中信银行+数据中心+OR+中信银行+科技&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    - id: "ceb"
      name: "光大银行"
      url: "https://news.google.com/rss/search?q=光大银行+数据中心+OR+光大银行+科技&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    - id: "pingan"
      name: "平安银行"
      url: "https://news.google.com/rss/search?q=平安银行+数据中心+OR+平安银行+科技&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    - id: "cgb"
      name: "广发银行"
      url: "https://news.google.com/rss/search?q=广发银行+数据中心+OR+广发银行+科技&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    - id: "cmbc"
      name: "民生银行"
      url: "https://news.google.com/rss/search?q=民生银行+数据中心+OR+民生银行+科技&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    - id: "hxb"
      name: "华夏银行"
      url: "https://news.google.com/rss/search?q=华夏银行+数据中心+OR+华夏银行+科技&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    # --- 行业资讯 ---
    - id: "datacenter"
      name: "数据中心行业"
      url: "https://news.google.com/rss/search?q=数据中心+UPS+OR+数据中心+供电+OR+数据中心+机柜&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    - id: "guangdong-finance"
      name: "广东金融科技"
      url: "https://news.google.com/rss/search?q=广东+银行+数据中心+OR+广东+金融+科技+OR+大湾区+金融&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"

    # --- 国际 ---
    - id: "hacker-news"
      name: "Hacker News"
      url: "https://hnrss.org/frontpage"


# ===============================================================
# 4. 报告模式
# ===============================================================
report:
  mode: "current"

  display_mode: "keyword"

  sort_by_position_first: true

  rank_threshold: 5

  max_news_per_keyword: 0


# ===============================================================
# 4.5 筛选策略
# ===============================================================
filter:
  method: "keyword"

  priority_sort_enabled: true


# ===============================================================
# 4.6 AI 智能筛选配置
# ===============================================================
ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.7
  reclassify_threshold: 0.6
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"


# ===============================================================
# 5. 推送内容控制
# ===============================================================
display:
  region_order:
    - ai_analysis
    - new_items
    - hotlist
    - rss
    - standalone

  regions:
    hotlist: true
    new_items: true
    rss: true
    standalone: true
    ai_analysis: true

  standalone:
    platforms: ["baidu", "weibo", "zhihu", "toutiao", "wallstreetcn-hot", "cls-hot", "thepaper", "ifeng"]
    rss_feeds: []
    max_items: 30


# ===============================================================
# 6. 推送通知
# ===============================================================
notification:
  enabled: true

  channels:
    feishu:
      webhook_url: ""

    dingtalk:
      webhook_url: ""

    wework:
      webhook_url: ""
      msg_type: "markdown"

    telegram:
      bot_token: ""
      chat_id: ""

    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""

    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""

    bark:
      url: ""

    slack:
      webhook_url: ""

    generic_webhook:
      webhook_url: ""
      payload_template: ""


# ===============================================================
# 7. 存储配置
# ===============================================================
storage:
  backend: "auto"

  formats:
    sqlite: true
    txt: false
    html: true

  local:
    data_dir: "output"
    retention_days: 0

  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""

  pull:
    enabled: false
    days: 7


# ===============================================================
# 8. AI 模型配置
# ===============================================================
ai:
  model: "deepseek/deepseek-chat"

  api_key: ""

  api_base: ""

  timeout: 120

  temperature: 1.0

  max_tokens: 5000

  num_retries: 1
  fallback_models: []


# ===============================================================
# 9. AI 分析功能
# ===============================================================
ai_analysis:
  enabled: true

  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"

  mode: "follow_report"

  max_news_for_analysis: 150

  include_rss: true
  include_standalone: true

  include_rank_timeline: true


# ===============================================================
# 10. AI 翻译功能
# ===============================================================
ai_translation:
  enabled: false
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"

  batch_size: 100
  batch_interval: 2

  scope:
    hotlist: false
    rss: true
    standalone: true


# ===============================================================
# 11. 高级设置
# ===============================================================
advanced:
  debug: false

  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"

  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"

  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""

  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1

  max_accounts_per_channel: 3

  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
