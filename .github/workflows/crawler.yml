name: Get Hot News

on:
  schedule:
    - cron: "0 0,9 * * *"
  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Expiration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORKFLOW_FILE="crawler.yml"
          API_URL="repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILE/runs"
          TOTAL=$(gh api "$API_URL" --jq '.total_count')
          if [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            echo "No previous runs found, skipping expiration check"
            exit 0
          fi
          LAST_PAGE=$(( (TOTAL + 99) / 100 ))
          FIRST_RUN_DATE=$(gh api "$API_URL?per_page=100&page=$LAST_PAGE" --jq '.workflow_runs[-1].created_at')
          if [ -n "$FIRST_RUN_DATE" ]; then
            CURRENT_TIMESTAMP=$(date +%s)
            FIRST_RUN_TIMESTAMP=$(date -d "$FIRST_RUN_DATE" +%s)
            DIFF_SECONDS=$((CURRENT_TIMESTAMP - FIRST_RUN_TIMESTAMP))
            LIMIT_SECONDS=604800
            if [ $DIFF_SECONDS -gt $LIMIT_SECONDS ]; then
              echo "Trial expired. Run 'Check In' to renew."
              gh workflow disable "$WORKFLOW_FILE"
              exit 1
            else
              DAYS_LEFT=$(( (LIMIT_SECONDS - DIFF_SECONDS) / 86400 ))
              echo "Trial: ${DAYS_LEFT} days left."
            fi
          fi

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        if: success()
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        if: success()
        run: uv sync --frozen --no-dev

      - name: Verify required files
        if: success()
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: config/config.yaml missing"
            exit 1
          fi
          if [ ! -f dashboard.py ]; then
            echo "Error: dashboard.py missing"
            exit 1
          fi

      - name: Run crawler
        if: success()
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          GITHUB_ACTIONS: true
        run: uv run python -m trendradar

      - name: Generate visual dashboard
        if: success()
        run: |
          python dashboard.py
          echo "=== Dashboard output ==="
          ls -la _site/
          ls -la _site/reports/ 2>/dev/null || echo "No reports dir"
          ls -la reports/ 2>/dev/null || echo "No persistent reports dir yet"

      - name: Commit historical reports
        if: success()
        run: |
          mkdir -p reports
          if [ -d "_site/reports" ]; then
            cp -f _site/reports/*.html reports/ 2>/dev/null || true
          fi
          # Keep only latest 60 reports
          ls -t reports/*.html 2>/dev/null | tail -n +61 | xargs -r rm -f
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No new reports to commit"
          else
            git commit -m "📊 Add report $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
            echo "Reports committed and pushed"
          fi

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send ntfy notification
        if: success()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          SITE_URL="https://${OWNER}.github.io/${REPO}/"
          REPORT_TIME=$(TZ='Asia/Shanghai' date '+%H:%M')
          curl -s -X POST "https://ntfy.sh/$NTFY_TOPIC" \
            -H "Title: 热点情报已更新" \
            -H "Click: $SITE_URL" \
            -H "Tags: newspaper" \
            -H "Priority: default" \
            -H "Markdown: yes" \
            -d "最新热点情报已生成（$REPORT_TIME），[点击查看仪表盘]($SITE_URL)"
          echo "Notification sent!"
